name: Build Android

on:
  push:
    branches:
      - main
      - experimental
      - patch-1

  pull_request:
    branches:
      - main
      - experimental
      - patch-1

  workflow_dispatch:
    inputs:
      version:
        description: 'Tag for release (ex: v1.0.0). Leave blank to skip release.'
        required: false
        type: string

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.6
  JAVA_VERSION: 21
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  build-android:
    name: Build Psych Mobile Android
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ------------------------------------------------------------
      # Haxe
      # ------------------------------------------------------------
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            ninja-build \
            libvlc-dev \
            libvlccore-dev \
            vlc

      # ------------------------------------------------------------
      # Clean Haxelib environment
      # ------------------------------------------------------------
      - name: Clean Haxelib
        run: |
          rm -rf ~/.haxelib
          rm -rf ~/haxelib
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      # ------------------------------------------------------------
      # Configure project settings
      # ------------------------------------------------------------
      - name: Configure Cocoa settings
        run: |
          echo "skipSScriptSetup=true" >> ~/settings.cocoa

      # ------------------------------------------------------------
      # Project setup
      # ------------------------------------------------------------
      - name: Setup project
        run: |
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      # ------------------------------------------------------------
      # Install required Haxelib dependencies
      # ------------------------------------------------------------
      - name: Install android-manager
        run: |
          haxelib install android-manager

      # ------------------------------------------------------------
      # Android environment
      # ------------------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "ANDROID_SETUP=true" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Verify Haxelib dependencies
      # ------------------------------------------------------------
      - name: Verify Haxelib
        run: |
          haxelib list
          haxelib path android-manager

      # ------------------------------------------------------------
      # Build Psych Engine Mobile
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          haxelib run lime build Project.xml android -D officialBuild

      # ------------------------------------------------------------
      # Locate APK
      # ------------------------------------------------------------
      - name: Find APK
        id: apk
        run: |
          APK=$(find export/android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was generated."
            find export/android -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychMobile-Android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # ------------------------------------------------------------
      # Optional GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Psych Mobile ${{ github.event.inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
