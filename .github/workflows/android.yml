name: Build Android

on:
  push:
    branches: [main, experimental, patch-1]
  pull_request:
    branches: [main, experimental, patch-1]
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.6
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  buildAndroid:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean workspace outputs
        run: |
          rm -rf export dump .haxelib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            clang \
            g++ \
            pkg-config \
            python3 \
            zlib1g-dev \
            libssl-dev \
            libmbedtls-dev \
            libasound2-dev \
            libpulse-dev \
            libopenal-dev \
            libsndfile1-dev \
            libsdl2-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            libjpeg-dev \
            libudev-dev \
            libcurl4-openssl-dev \
            libxkbcommon-dev \
            libglu1-mesa-dev \
            wget \
            git
          # optional: install wine if you plan to try windows build on ubuntu runner
          # sudo apt-get install -y -qq wine

      - name: Install Haxe libraries
        run: |
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Configure Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: |
          set -x
          echo "Running: haxelib run lime build Project.xml android -D officialBuild"
          haxelib run lime build Project.xml android -D officialBuild

      - name: Show generated AndroidManifest.xml on failure
        if: failure()
        run: |
          manifest="export/release/android/bin/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            cat "$manifest"
          else
            find export/release/android -name "*.xml" 2>/dev/null || true
          fi

      - name: Upload manifest artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-manifest
          path: export/release/android/bin/app/src/main/AndroidManifest.xml
          if-no-files-found: ignore

      - name: Upload Android artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: |
            export/release/android/bin/app/build/outputs/apk/**/*.apk
            export/release/android/bin/**/*.apk
          if-no-files-found: error
