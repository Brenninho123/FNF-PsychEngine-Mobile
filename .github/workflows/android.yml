name: Build Android

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Clean previous builds
        run: |
          rm -rf export/
          rm -rf dump/
          rm -rf .haxelib/
          echo "✓ Cache cleaned"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libvlc-dev
          sudo apt-get install -qq libvlccore-dev
          haxelib setup ~/haxelib --quiet
          haxelib install hxcpp > /dev/null --quiet
          haxelib update --always
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Install dependencies via hmm
        run: |
          haxelib git hmm https://github.com/andywhite37/hmm.git --quiet
          haxelib run hmm install --quiet

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Setup Android SDK and NDK for Lime
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --update
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME
          yes "" | haxelib run lime setup android

      - name: Compile
        run: |
          echo "Starting compilation..."
          haxelib run lime build Project.xml android -D officialBuild -v

      - name: Show generated AndroidManifest.xml on failure
        if: failure()
        run: |
          echo "=== Checking Android Build Output ==="
          if [ -f export/release/android/bin/app/src/main/AndroidManifest.xml ]; then
            echo "✓ Manifest found. Content:"
            cat export/release/android/bin/app/src/main/AndroidManifest.xml
          else
            echo "❌ Manifest not found at expected path"
            echo "Checking export directory structure:"
            find export/release/android -name "*.xml" 2>/dev/null || echo "No XML files found"
          fi

      - name: Upload manifest artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: generated-manifest
          path: export/release/android/bin/app/src/main/AndroidManifest.xml

      - name: Publish Artifact
        if: success()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/release/android/bin
