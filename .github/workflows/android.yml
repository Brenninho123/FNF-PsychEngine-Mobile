name: Build Android

on:
  push:
    branches:
      - main
      - experimental
      - patch-1

  pull_request:
    branches:
      - main
      - experimental
      - patch-1

  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.6
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  android:
    name: Build Psych Mobile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Workspace
        run: |
          rm -rf export
          rm -rf dump
          rm -rf .haxelib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            clang \
            g++ \
            pkg-config \
            python3 \
            zlib1g-dev \
            libssl-dev \
            libmbedtls-dev \
            libasound2-dev \
            libpulse-dev \
            libopenal-dev \
            libsndfile1-dev \
            libsdl2-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            libjpeg-dev \
            libudev-dev \
            libcurl4-openssl-dev \
            libxkbcommon-dev \
            wget \
            git

      - name: Install Haxelib Libraries
        run: |
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Configure Android Toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild hxcpp
        run: |
          haxelib run lime rebuild hxcpp --quiet

      - name: Build Psych Mobile
        run: |
          set -e
          set -x

          haxelib run lime build Project.xml android -D officialBuild

      - name: Show Build Information on Failure
        if: failure()
        run: |
          echo "===== Android build files ====="
          find export/release/android -maxdepth 8 -type f 2>/dev/null || true

          echo "===== AndroidManifest.xml ====="
          manifest="export/release/android/bin/app/src/main/AndroidManifest.xml"

          if [ -f "$manifest" ]; then
            cat "$manifest"
          else
            echo "AndroidManifest.xml not found."
          fi

      - name: Upload Psych Mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychMobile-Android
          path: |
            export/release/android/bin/app/build/outputs/apk/**/*.apk
            export/release/android/bin/**/*.apk
          if-no-files-found: error
